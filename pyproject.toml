[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmerge"
version = "0.1.0"
description = "Modernized research engineering toolkit for video query processing and track merging."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "See repository notice" }
authors = [
  { name = "Daren Chao" },
]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "mypy>=1.9",
  "motmetrics>=1.4",
  "pytest>=8.0",
  "ruff>=0.4.0",
]
openmmlab = [
  "torch>=2.2",
  "mmcv>=1.3.8,<1.4",
  "mmdet>=2.15,<3",
  "mmtrack>=0.6,<1",
]
reid = [
  "torch>=2.2",
  "torchreid",
  "tensorboard",
  "yacs",
]
mot = [
  "matplotlib>=3.8",
  "motmetrics>=1.4",
]

[project.scripts]
tmerge = "tmerge.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
  "e2e",
  "scripts",
  "src/tmerge.egg-info",
  "tools",
  "videosys",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["tmerge"]

[tool.mypy]
files = ["src/tmerge", "tests"]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
